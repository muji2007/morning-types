<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早八人格图鉴 | Morning Class Personality Guide</title>
<style>
/* ===== FONTS ===== */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');

/* ===== RESET & VARIABLES ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2c2416; --ink-light:#5c5240; --muted:#8a7e6e;
  --paper:#faf7f2; --paper-warm:#f5efe5; --card:#fffdf9;
  --border:#e8e0d4; --border-active:#d4c8b0;
  --gold:#d4983c; --gold-light:#f5e6cc;
  --green:#3d8b6e; --green-light:#d8efe4;
  --blue:#4a7eb8; --blue-light:#dce8f4;
  --purple:#7b5ea7; --purple-light:#e8e0f4;
  --red:#c45050; --red-light:#f8e0e0;
  --radius-sm:10px; --radius:16px; --radius-lg:24px;
  --shadow-sm:0 2px 8px rgba(44,36,22,.04);
  --shadow:0 4px 20px rgba(44,36,22,.06);
  --shadow-lg:0 8px 40px rgba(44,36,22,.08);
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
  --font-display:'Playfair Display', 'Noto Serif SC', 'STSong', Georgia, serif;
  --font-body:'DM Sans', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
}
body{
  font-family:var(--font-body); background:var(--paper);
  color:var(--ink); min-height:100vh; line-height:1.65;
  background-image: radial-gradient(ellipse at 20% 10%, #faf3e8 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 90%, #f5efe0 0%, transparent 60%);
  background-attachment: fixed;
}

/* ===== CONTAINER ===== */
.container{max-width:680px;margin:0 auto;padding:20px 20px 60px}

/* ===== LANGUAGE SWITCH ===== */
.lang-bar{display:flex;justify-content:flex-end;padding:10px 0 6px}
.lang-pill{display:flex;background:var(--card);border:1.5px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-sm)}
.lang-pill button{padding:8px 18px;border:none;background:transparent;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);transition:all var(--transition);font-family:var(--font-body);letter-spacing:0.01em}
.lang-pill button.active{background:var(--ink);color:#fff}

/* ===== LANDING PAGE ===== */
.landing{text-align:center;padding:8px 0}
.hero-img{margin:0 auto 8px;max-width:420px}
.hero-img img{width:100%;height:auto;display:block}
.landing h1{font-family:var(--font-display);font-size:clamp(2rem,5vw,2.8rem);font-weight:800;color:var(--ink);letter-spacing:-0.01em;line-height:1.2;margin-bottom:6px}
.landing .subtitle{font-size:.95rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:20px}
.landing .intro{font-size:1.05rem;color:var(--ink-light);max-width:440px;margin:0 auto 32px;line-height:1.7}
.features{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:36px}
.feat{flex:1;min-width:100px;max-width:140px;padding:18px 8px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);text-align:center;transition:all var(--transition)}
.feat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.feat .feat-icon{font-size:34px;margin-bottom:8px;line-height:1}
.feat .feat-label{font-size:.78rem;color:var(--muted);font-weight:500}
.btn-start{display:inline-block;padding:16px 48px;background:var(--ink);color:#fff;border:none;border-radius:32px;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all var(--transition);font-family:var(--font-body);letter-spacing:0.02em;box-shadow:0 4px 16px rgba(44,36,22,.15)}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(44,36,22,.22);background:#3d3428}

/* ===== QUIZ PAGE ===== */
.quiz-header{padding:8px 0 4px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);border-radius:3px;transition:width .5s cubic-bezier(0.4,0,0.2,1)}
.progress-num{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all var(--transition)}
.step-dot.done{background:var(--ink)}
.step-dot.current{background:var(--gold);transform:scale(1.3)}

.question-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow);animation:slideUp .45s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.question-card h3{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:22px;line-height:1.4}

/* Radio options */
.q-options{display:flex;flex-direction:column;gap:8px}
.q-options label{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all var(--transition);font-size:.93rem;color:var(--ink-light);background:#fefdfb}
.q-options label:hover{border-color:var(--border-active);background:var(--paper-warm)}
.q-options input[type="radio"]{display:none}
.q-options .radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all var(--transition);position:relative}
.q-options label:has(input:checked) .radio-dot{border-color:var(--ink);background:var(--ink)}
.q-options label:has(input:checked) .radio-dot::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.q-options label:has(input:checked){border-color:var(--ink);background:#faf8f4;color:var(--ink);font-weight:600}

/* Day selector */
.q-days{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.q-days button{width:52px;height:52px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:1.15rem;font-weight:700;color:var(--ink);transition:all var(--transition);font-family:var(--font-body)}
.q-days button:hover{border-color:var(--ink);transform:translateY(-2px)}
.q-days button.selected{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}
.q-days-label{text-align:center;margin-top:10px;font-size:.82rem;color:var(--muted)}

/* Nav buttons */
.quiz-nav{display:flex;gap:12px;justify-content:center;padding:20px 0}
.btn{padding:13px 28px;border:none;border-radius:28px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all var(--transition);font-family:var(--font-body);letter-spacing:0.01em}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px rgba(44,36,22,.2)}
.btn-ghost{background:transparent;color:var(--ink-light)}
.btn-ghost:hover{color:var(--ink)}

/* ===== RESULT PAGE ===== */
.result-wrap{animation:slideUp .5s cubic-bezier(0.4,0,0.2,1)}
.result-hero{text-align:center;padding:0 0 20px}
.result-hero .illustration{max-width:260px;margin:0 auto 8px}
.result-hero .illustration img{width:100%;height:auto;display:block}
.result-type-tag{display:inline-block;padding:5px 16px;border-radius:20px;font-size:.76rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px}
.result-type-name{font-family:var(--font-display);font-size:2rem;font-weight:800;margin-bottom:6px;line-height:1.2}
.result-type-sub{font-size:.88rem;color:var(--muted);margin-bottom:4px}
.result-tagline{font-size:1rem;color:var(--ink-light);font-style:italic;margin-bottom:18px;line-height:1.5}

.result-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.result-card h4{font-family:var(--font-display);font-size:1.1rem;font-weight:700;margin-bottom:10px;color:var(--ink)}

/* Stat bars */
.stat-bars{display:flex;flex-direction:column;gap:12px}
.stat-row{display:flex;align-items:center;gap:12px}
.stat-label{width:80px;font-size:.78rem;font-weight:600;color:var(--ink-light);text-align:right;flex-shrink:0}
.stat-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(0.4,0,0.2,1)}
.stat-pct{width:42px;font-size:.78rem;font-weight:700;color:var(--ink);text-align:right}

/* Advice */
.advice-list{padding:0;list-style:none}
.advice-list li{padding:10px 0 10px 28px;position:relative;font-size:.9rem;color:var(--ink-light);line-height:1.55;border-bottom:1px solid var(--border)}
.advice-list li:last-child{border-bottom:none}
.advice-list li::before{content:'→';position:absolute;left:0;top:10px;font-weight:700;font-size:.85rem}

/* Action buttons */
.action-row{display:flex;gap:10px;justify-content:center;padding:8px 0}
.btn-outline{padding:12px 28px;border:1.5px solid var(--border);border-radius:28px;background:var(--card);font-size:.9rem;font-weight:700;cursor:pointer;transition:all var(--transition);font-family:var(--font-body);color:var(--ink)}
.btn-outline:hover{background:var(--paper-warm);border-color:var(--ink)}
.btn-filled{padding:12px 28px;border:none;border-radius:28px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all var(--transition);font-family:var(--font-body);color:#fff}
.btn-filled:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15)}

/* ===== FOOTER ===== */
.footer{text-align:center;padding:40px 0 16px;font-size:.72rem;color:var(--muted);line-height:1.8}
.footer span{opacity:.7}

/* ===== UTILITY ===== */
.hidden{display:none!important}
.text-center{text-align:center}

/* ===== TYPE-SPECIFIC OVERRIDES (applied via JS to result-hero) ===== */
.type-sc8{--type-color:var(--gold);--type-bg:var(--gold-light)}
.type-ev8{--type-color:var(--green);--type-bg:var(--green-light)}
.type-dt8{--type-color:var(--blue);--type-bg:var(--blue-light)}
.type-nc8{--type-color:var(--purple);--type-bg:var(--purple-light)}
.type-lp8{--type-color:var(--red);--type-bg:var(--red-light)}

/* ===== RESPONSIVE ===== */
@media(max-width:500px){
  .container{padding:10px 12px 40px}
  .question-card{padding:24px 16px}
  .result-card{padding:20px 16px}
  .feat{min-width:70px;padding:14px 4px}
  .feat .feat-icon{font-size:28px}
  .hero-img{max-width:300px}
  .stat-label{width:64px;font-size:.72rem}
}
</style>
</head>

// ==================== GLOBAL STATE ====================
let lang = 'zh';
let currentQ = 0;
let answers = new Array(8).fill(null);
const totalQ = 8;

// Question definitions
const questions = [
  { id:'chronotype', type:'radio', scale:5, labels_zh:['q1_1','q1_2','q1_3','q1_4','q1_5'], labels_en:['q1_1','q1_2','q1_3','q1_4','q1_5'], weight:1.5 },
  { id:'sleepLoss', type:'radio', scale:5, labels_zh:['scale_never','scale_rarely','scale_sometimes','scale_often','scale_always'], labels_en:['scale_never','scale_rarely','scale_sometimes','scale_often','scale_always'], weight:1.5 },
  { id:'avoidance', type:'radio', scale:5, labels_zh:['scale_neverAvoid','scale_rarely2','scale_neutral2','scale_prefer','scale_alwaysAvoid'], labels_en:['scale_neverAvoid','scale_rarely2','scale_neutral2','scale_prefer','scale_alwaysAvoid'], weight:1.0 },
  { id:'routine', type:'radio', scale:5, labels_zh:['scale_disagree','scale_slightly','scale_neutral','scale_agree','scale_strongly'], labels_en:['scale_disagree','scale_slightly','scale_neutral','scale_agree','scale_strongly'], weight:1.0 },
  { id:'concentration', type:'radio', scale:5, labels_zh:['scale_cant','scale_struggle','scale_neutralC','scale_mostly','scale_very'], labels_en:['scale_cant','scale_struggle','scale_neutralC','scale_mostly','scale_very'], weight:1.0 },
  { id:'afternoon', type:'radio', scale:5, labels_zh:['scale_disagree','scale_slightly','scale_neutral','scale_agree','scale_strongly'], labels_en:['scale_disagree','scale_slightly','scale_neutral','scale_agree','scale_strongly'], weight:1.0 },
  { id:'weeklyDays', type:'days', scale:6, weight:0.5 },
  { id:'fatigue', type:'radio', scale:5, labels_zh:['q8_1','q8_2','q8_3','q8_4','q8_5'], labels_en:['q8_1','q8_2','q8_3','q8_4','q8_5'], weight:1.0 },
];

// Type centroids [chronotype, sleepLoss, avoidance, routine, concentration, afternoon, weeklyDays(norm 1-5), fatigue]
const centroids = {
  'SC-8': [1.5, 1.5, 1.5, 4.0, 3.5, 4.0, 3.0, 1.5],
  'EV-8': [2.5, 3.5, 3.5, 4.0, 3.0, 4.0, 4.0, 3.0],
  'DT-8': [3.0, 3.5, 3.5, 3.0, 2.5, 3.5, 3.0, 3.5],
  'NC-8': [4.0, 4.0, 4.5, 2.5, 2.5, 3.0, 2.0, 4.0],
  'LP-8': [4.5, 4.5, 5.0, 1.5, 1.5, 1.5, 3.0, 4.5],
};

const typeColors = { 'SC-8':'#d4983c', 'EV-8':'#3d8b6e', 'DT-8':'#4a7eb8', 'NC-8':'#7b5ea7', 'LP-8':'#c45050' };
const typeColorBg = { 'SC-8':'#fdf6ea', 'EV-8':'#eaf6f0', 'DT-8':'#ecf2f8', 'NC-8':'#f4eef8', 'LP-8':'#fdf0f0' };
const typeImages = { 'SC-8':'images/sc-8_opt.png', 'EV-8':'images/ev-8_opt.png', 'DT-8':'images/dt-8_opt.png', 'NC-8':'images/nc-8_opt.png', 'LP-8':'images/lp-8_opt.png' };
const typeCssClass = { 'SC-8':'type-sc8', 'EV-8':'type-ev8', 'DT-8':'type-dt8', 'NC-8':'type-nc8', 'LP-8':'type-lp8' };

// ==================== FUNCTIONS ====================
function t(key){ return I18N[lang][key] || key; }
function tf(key, ...args){ let s=t(key); args.forEach((a,i)=>{s=s.replace(`{${i}}`,a)}); return s; }

function setLang(l){
  lang=l;
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  document.title = t('title');
  renderAll();
}
function switchLang(l){ setLang(l); }

function startQuiz(){
  currentQ=0; answers=new Array(8).fill(null);
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderAll(){
  if(!document.getElementById('quiz').classList.contains('hidden')) renderQuestion();
  if(!document.getElementById('result').classList.contains('hidden')) renderResult();
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(key&&I18N[lang][key]) el.innerHTML=I18N[lang][key];
  });
}

function renderQuestion(){
  const q=questions[currentQ];
  const card=document.getElementById('questionCard');
  const qTitleKey='q'+(currentQ+1);
  let html=`<h3>${t(qTitleKey)}</h3>`;

  if(q.type==='radio'){
    html+='<div class="q-options">';
    const labels=(lang==='zh'?q.labels_zh:q.labels_en);
    for(let i=0;i<q.scale;i++){
      const checked=answers[currentQ]===i+1?'checked':'';
      html+=`<label><input type="radio" name="q${currentQ}" value="${i+1}" ${checked} onchange="selectRadio(${currentQ},${i+1})"><span class="radio-dot"></span><span>${t(labels[i])}</span></label>`;
    }
    html+='</div>';
  } else if(q.type==='days'){
    html+='<div class="q-days">';
    for(let i=0;i<=5;i++){
      const sel=answers[currentQ]===i?'selected':'';
      html+=`<button class="${sel}" onclick="selectDay(${i})">${i}</button>`;
    }
    html+=`</div><div class="q-days-label">${t('days')}</div>`;
  }

  card.innerHTML=html;

  // Step dots
  let dotsHtml='';
  for(let i=0;i<totalQ;i++){
    let cls='step-dot';
    if(answers[i]!==null) cls+=' done';
    if(i===currentQ) cls+=' current';
    dotsHtml+=`<span class="${cls}"></span>`;
  }
  document.getElementById('stepDots').innerHTML=dotsHtml;

  // Progress
  const pct=Math.round(currentQ/totalQ*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=tf('progress',currentQ+1);

  // Buttons
  document.getElementById('prevBtn').classList.toggle('hidden',currentQ===0);
  const nextBtn=document.getElementById('nextBtn');
  if(currentQ===totalQ-1){
    nextBtn.textContent=t('submit');
    nextBtn.onclick=submitQuiz;
  } else {
    nextBtn.textContent=t('next');
    nextBtn.onclick=nextQuestion;
  }
  nextBtn.disabled=(answers[currentQ]===null);
}

function selectRadio(qIdx,val){ answers[qIdx]=val; updateNextBtn(); }
function selectDay(val){ answers[currentQ]=val; document.querySelectorAll('.q-days button').forEach((b,i)=>{b.classList.toggle('selected',i===val)}); updateNextBtn(); }
function updateNextBtn(){ document.getElementById('nextBtn').disabled=(answers[currentQ]===null); }

function nextQuestion(){ if(currentQ<totalQ-1){ currentQ++; renderQuestion(); } }
function prevQuestion(){ if(currentQ>0){ currentQ--; renderQuestion(); } }

let bestDist=null;
function submitQuiz(){
  const result=computeType();
  bestDist=result.dist;
  const type=result.type;
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  window._resultType=type;
  renderResult();
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

function computeType(){
  const vec=[
    answers[0], answers[1], answers[2], answers[3],
    answers[4], answers[5],
    answers[6]/5*4+1,
    answers[7],
  ];
  const weights=[1.5, 1.5, 1.0, 1.0, 1.0, 1.0, 0.5, 1.0];
  let bestType=null, bestDist=Infinity;
  for(const [type, cent] of Object.entries(centroids)){
    let dist=0;
    for(let i=0;i<8;i++){ dist+=weights[i]*Math.pow(vec[i]-cent[i],2); }
    dist=Math.sqrt(dist);
    if(dist<bestDist){ bestDist=dist; bestType=type; }
  }
  return {type:bestType, dist:bestDist};
}

function renderResult(){
  const type=window._resultType||'SC-8';
  const isZh=lang==='zh';
  const typeName=isZh?t('type_'+type.toLowerCase().replace('-','')):t('type_'+type.toLowerCase().replace('-',''));
  const cnKey=type.toLowerCase().replace('-','');
  const typeName2=isZh?I18N['en']['type_'+cnKey]:(I18N['zh']['type_'+cnKey]||'');
  const color=typeColors[type];
  const bgColor=typeColorBg[type];
  const imgSrc=typeImages[type];
  const tagline=t('tagline_'+cnKey);
  const desc=t('desc_'+cnKey);
  const advice=t('advice_'+cnKey);
  const adviceLabel=t('advice_label');

  const statDefs=[
    {key:'stats_nightowl', val:Math.round(answers[0]/5*100)},
    {key:'stats_sleeploss', val:Math.round(answers[1]/5*100)},
    {key:'stats_avoid', val:Math.round(answers[2]/5*100)},
    {key:'stats_focus', val:Math.round(answers[4]/5*100)},
  ];

  let statBarsHtml='';
  statDefs.forEach(s=>{
    statBarsHtml+=`
      <div class="stat-row">
        <span class="stat-label">${t(s.key)}</span>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${s.val}%;background:${color}"></div></div>
        <span class="stat-pct">${s.val}%</span>
      </div>`;
  });

  let adviceHtml='';
  advice.forEach(a=>{ adviceHtml+=`<li>${a}</li>`; });

  const html=`
    <div class="result-hero" style="background:${bgColor};border-radius:var(--radius-lg);padding:28px 20px 24px;margin-bottom:16px">
      <div class="illustration"><img src="${imgSrc}" alt="${typeName}" width="260" height="520" loading="lazy" decoding="async"></div>
      <div class="result-type-tag" style="background:${color}18;color:${color}">${typeName} · ${typeName2}</div>
      <div class="result-type-name" style="color:${color}">${typeName}</div>
      <div class="result-type-sub">${typeName2}</div>
      <div class="result-tagline">${tagline}</div>
      <p style="font-size:.93rem;color:var(--ink-light);line-height:1.7;max-width:480px;margin:0 auto">${desc}</p>
    </div>

    <div class="result-card">
      <h4>${isZh?'你的指标':'Your Stats'}</h4>
      <div class="stat-bars">${statBarsHtml}</div>
    </div>

    <div class="result-card">
      <h4>${adviceLabel}</h4>
      <ul class="advice-list">${adviceHtml}</ul>
    </div>
  `;

  document.getElementById('resultWrap').innerHTML=html;
  document.getElementById('shareBtn').style.background=color;

  // Animate stat bars after a tiny delay
  setTimeout(()=>{
    document.querySelectorAll('.stat-bar-fill').forEach(bar=>{
      const w=bar.style.width;
      bar.style.width='0%';
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bar.style.width=w; }); });
    });
  },100);
}

function restartQuiz(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('landing').classList.remove('hidden');
  answers=new Array(8).fill(null);
  currentQ=0;
}

function shareResult(){
  const type=window._resultType||'SC-8';
  const typeName=t('type_'+type.toLowerCase().replace('-',''));
  const text=`${t('share_title')}${typeName}！${t('share_text')}`;
  if(navigator.share){
    navigator.share({title:t('title'),text:text,url:window.location.href}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text+'\n'+window.location.href).then(()=>{
      alert(isZh?'结果已复制到剪贴板！':'Result copied to clipboard!');
    });
  }
}

// ==================== INIT ====================
document.querySelectorAll('#langSwitch button').forEach(btn=>{
  btn.addEventListener('click',()=>switchLang(btn.dataset.lang));
});
setLang('zh');
</script>
</body>
</html>
